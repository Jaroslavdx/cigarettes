<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Сигареты">
<meta name="theme-color" content="#0b0b0c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Сигареты</title>
<style>
  :root {
    --bg: #0b0b0c;
    --green: #22c55e;
    --red: #ef4444;
    --text: #f4f4f5;
    --muted: #71717a;
    --accent: var(--green);
  }
  body.red { --accent: var(--red); }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }

  .top {
    margin-top: 28px;
    text-align: center;
  }
  .count {
    font-size: 64px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .count-label {
    margin-top: 6px;
    font-size: 15px;
    color: var(--muted);
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }
  .btn {
    width: min(78vw, 360px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 0;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: .01em;
    box-shadow: 0 0 80px color-mix(in srgb, var(--accent) 35%, transparent);
    transition: transform .08s ease, background .4s ease, box-shadow .4s ease;
  }
  .btn:active { transform: scale(.94); }

  .bottom {
    margin-bottom: 34px;
    text-align: center;
  }
  .timer {
    font-size: 56px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    transition: color .4s ease;
  }
  .timer-label {
    margin-top: 4px;
    font-size: 15px;
    color: var(--muted);
  }
  .undo {
    margin-top: 18px;
    background: none;
    border: 0;
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    padding: 8px 12px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .undo[hidden] { display: inline-block; visibility: hidden; }
</style>
</head>
<body class="green">
  <div class="top">
    <div class="count" id="count">0</div>
    <div class="count-label">сегодня</div>
  </div>

  <div class="main">
    <button class="btn" id="btn">Покурил</button>
  </div>

  <div class="bottom">
    <div class="timer" id="timer">--:--</div>
    <div class="timer-label">часов : минут назад</div>
    <button class="undo" id="undo" hidden>отменить последнюю</button>
  </div>

<script>
  const LIMIT_MS = 2 * 60 * 60 * 1000;
  const KEY = 'cig-log';

  const $count = document.getElementById('count');
  const $timer = document.getElementById('timer');
  const $btn = document.getElementById('btn');
  const $undo = document.getElementById('undo');

  const load = () => {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  };
  const save = (log) => {
    try { localStorage.setItem(KEY, JSON.stringify(log)); } catch {}
  };

  let log = load();

  const isToday = (ts) => new Date(ts).toDateString() === new Date().toDateString();
  const pad = (n) => String(n).padStart(2, '0');

  function render() {
    const last = log[log.length - 1];
    const elapsed = last ? Date.now() - last : Infinity;
    const calm = elapsed >= LIMIT_MS;

    document.body.className = calm ? 'green' : 'red';
    $count.textContent = log.filter(isToday).length;
    $undo.hidden = !last;

    if (!last) {
      $timer.textContent = '--:--';
    } else {
      const mins = Math.floor(elapsed / 60000);
      $timer.textContent = pad(Math.floor(mins / 60)) + ':' + pad(mins % 60);
    }
  }

  $btn.addEventListener('click', () => {
    log.push(Date.now());
    save(log);
    render();
  });

  $undo.addEventListener('click', () => {
    log.pop();
    save(log);
    render();
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  document.addEventListener('visibilitychange', render);
  setInterval(render, 1000);
  render();
</script>
</body>
</html>
